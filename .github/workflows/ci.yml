name: CI
run-name: "${{ github.event_name == 'workflow_dispatch' && format('CI: {0}', github.ref_name) || '' }}"

on:
  push:
    branches:
      - dev
      - rc
      - master
  pull_request: ~
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, Type Check, Test, and Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff
        run: uv run ruff check .

      - name: MyPy
        run: uv run mypy src tests

      - name: Pylint
        run: uv run pylint src/onyxpublic

      - name: Pytest
        run: uv run pytest -q --cov=src/onyxpublic --cov-report=xml --cov-report=term-missing

      - name: Ensure base branch is available (PR only)
        if: github.event_name == 'pull_request'
        run: git fetch origin "${{ github.base_ref }}"

      - name: Diff coverage (changed lines >= 95%, PR only)
        if: github.event_name == 'pull_request'
        run: |
          set +e
          uvx --from diff-cover diff-cover coverage.xml \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=95 \
            --format markdown:diff-cover.md
          EXIT_CODE=$?
          echo "## Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
          cat diff-cover.md >> "$GITHUB_STEP_SUMMARY"
          exit $EXIT_CODE
