[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[project]
name = "onyxpublic"
version = "0.1.5"
description = "Python API for Sintela Onyx protobuf"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "grpcio==1.84.0",
    "protobuf==7.36.2",
    "googleapis-common-protos==1.75.4",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
plot = ["numpy>=2.4.6", "matplotlib>=3.11.2"]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "types-protobuf",
    "types-grpcio",
    "ruff>=0.16.9",
    "pylint==4.0.9",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "dotenv>=0.9.9",
    "grpcio-tools>=1.84.0",
    "mypy-protobuf>=5.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/onyxpublic"]

[tool.coverage.report]
omit = ["src/onyxpublic/api/*", "src/onyxpublic/common/*"]

[tool.ruff]
required-version = ">=0.15.1"
exclude = ["src/onyxpublic/api/", "src/onyxpublic/common/"]

[tool.pylint.main]
ignore-paths = [
    ".*\\.pyi$",
    ".*[/\\]onyxpublic[/\\]api[/\\].*",
    ".*[/\\]onyxpublic[/\\]common[/\\].*",
    ".*[/\\]tests[/\\].*",
]

[tool.pylint.messages_control]
disable = [
    "invalid-name",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-locals",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-few-public-methods",
    "no-member",
]
